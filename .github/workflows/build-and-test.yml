name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    strategy:
      matrix:
        dotnet-version: ['8.0', '10.0']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run tests with coverage
      run: dotnet test --no-build --configuration Release --verbosity normal -- --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura
    
    - name: Install ReportGenerator
      if: matrix.dotnet-version == '10.0'
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    
    - name: Generate coverage report
      if: matrix.dotnet-version == '10.0'
      run: reportgenerator -reports:Tests.Bebop.JsonPath/bin/Release/net*/TestResults/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Html
    
    - name: Upload coverage report
      if: matrix.dotnet-version == '10.0'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/
    
    - name: Upload coverage to Coveralls
      if: matrix.dotnet-version == '10.0'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: Tests.Bebop.JsonPath/bin/Release/net*/TestResults/coverage.cobertura.xml
        format: cobertura
